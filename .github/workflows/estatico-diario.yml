name: Post estatico diario @aurabelastore_on

# 19h BRT todo dia (21:45 UTC dispara, job espera ate 22:00:00 UTC = 19:00 BRT).
# Dois horarios por dia: 09h pega a rotina de skincare da manha, 19h pega o
# scroll da noite.

on:
  schedule:
    - cron: "45 21 * * *"
  workflow_dispatch:
    inputs:
      id:
        description: "Forcar um conteudo especifico (id do conteudos.json)"
        required: false
        type: string
      ensaio:
        description: "Ensaio: gera a arte sem publicar"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow

      # Enquanto o token nao existir, sair em SUCESSO com aviso — sem isso os
      # jobs agendados falhariam todo dia e encheriam o repo de issue falsa.
      - name: Conferir se o token ja foi configurado
        id: tok
        env:
          IG_TOKEN_AURABELA: ${{ secrets.IG_TOKEN_AURABELA }}
        run: |
          if [ -z "$IG_TOKEN_AURABELA" ]; then
            echo "::warning::Sem IG_TOKEN_AURABELA ainda — gerar o token e salvar no secret. Nada publicado."
            echo "pronto=nao" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: Esperar as 19h em ponto
        if: github.event_name == 'schedule' && steps.tok.outputs.pronto == 'sim'
        run: |
          alvo=$(date -u -d "$(date -u +%F) 22:00:00" +%s)
          agora=$(date -u +%s)
          espera=$(( alvo - agora ))
          if [ "$espera" -gt 0 ]; then
            echo "esperando ${espera}s ate 22:00:00 UTC (19:00 BRT)"
            sleep "$espera"
          else
            echo "runner comecou atrasado (${espera}s); publicando agora"
          fi

      - name: Publicar post estatico
        if: steps.tok.outputs.pronto == 'sim' || inputs.ensaio
        env:
          IG_TOKEN_AURABELA: ${{ secrets.IG_TOKEN_AURABELA }}
        run: |
          args=""
          [ -n "${{ inputs.id }}" ] && args="$args --id ${{ inputs.id }}"
          [ "${{ inputs.ensaio }}" = "true" ] && args="$args --ensaio"
          python publicar_estatico.py $args

      - name: Abrir issue se falhar
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Post estatico falhou em " + new Date().toISOString().slice(0, 10),
              body: "O post estatico diario falhou. Run: " +
                    context.serverUrl + "/" + context.repo.owner + "/" +
                    context.repo.repo + "/actions/runs/" + context.runId +
                    "\n\nCausas comuns, em ordem:\n" +
                    "1. Token do Instagram vencido (rodar o workflow Renovar token)\n" +
                    "2. Banco de conteudos esgotado (repor conteudos.json)\n"
            })
